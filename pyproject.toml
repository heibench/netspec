[project]
name = "kicad-netspec"
version = "0.7.0"
description = "Verify PCB connectivity against declared engineering intent, using KiCad as the oracle."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Cameron Brooks" }]
keywords = ["kicad", "pcb", "netlist", "verification", "eda", "hardware"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]

[project.scripts]
netspec = "kicad_netspec.cli:main"
netspec-mcp = "kicad_netspec.mcp:main"

[project.entry-points.pytest11]
netspec = "kicad_netspec.pytest_plugin"

[project.urls]
Homepage = "https://github.com/heibench/netspec"
Issues = "https://github.com/heibench/netspec/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_netspec"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11", "pyright>=1.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pcbnew".msg = "SWIG pcbnew is deleted in KiCad 11 (see docs/DECISIONS.md D3). Use the Oracle protocol."

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
