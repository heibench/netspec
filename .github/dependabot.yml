# Dependabot — because nothing else watches these pins.
#
# netspec was the only tool repo in the org without this. Its action pins, its
# committed `uv.lock` and its pre-commit hook revs were all unwatched, and the
# only signal a pin has rotted is usually a deprecation warning buried in the
# log of a green job.
#
# Grouped rather than one PR per dependency: a batch CI has run as a batch is
# the thing being merged, and several separate green PRs do not show that the
# updates work together. The `ok` gate decides whether each batch is safe.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # `uv`, not `pip`: the lockfile is committed, so the lock is the thing that
  # needs updating and `uv lock` is what updates it honestly.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    # ruff is pinned TWICE -- the dev group and `.pre-commit-config.yaml`'s rev
    # -- and `tests/test_lint_config.py` requires them equal (#30). They are
    # different ecosystems and Dependabot groups do not span ecosystems, so it
    # can only ever bump one half, which the gate would refuse every release.
    # ruff is a deliberate two-file manual bump instead, and both ecosystems
    # ignore it. The gate is what makes that safe: forgetting the second file
    # fails, it does not drift.
    ignore:
      - dependency-name: "ruff"

  # Hook revs rot exactly like action pins do, and nothing here was watching
  # them either.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      hooks:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    ignore:
      # The FULL URL: this ecosystem names a hook repo by its `repo:` value, so
      # `astral-sh/ruff-pre-commit` would match nothing and sit inert.
      - dependency-name: "https://github.com/astral-sh/ruff-pre-commit"
