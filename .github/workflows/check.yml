# Calls the `just` recipes so CI and local share one gate definition.
#
# Path-aware: docs-only changes skip the heavy check/test jobs via
# dorny/paths-filter, while the always-running `ok` aggregator still reports a
# green required status — so a docs PR merges without running the full matrix.
#
# Branch protection: require ONLY the `ok` context (not `check`/`test`). Skipped
# jobs don't block; only failures and cancellations do.

name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Declared rather than inherited from the repo default, so a widening shows in
# a diff (code-scanning actions/missing-workflow-permissions).
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  check:
    name: Check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Setup
        run: just setup

      - name: Check (fmt + lint + typecheck)
        run: just check

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup
        run: just setup

      - name: Test
        run: just test

  # `.pre-commit-config.yaml` claims its hooks check this repository. Until this
  # job they ran only where someone had run `pre-commit install`, and
  # `--no-verify` skipped them there. Not behind the paths filter: the
  # whitespace, end-of-file and conflict-marker hooks read Markdown and docs too.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # ─── Unified gate ─────────────────────────────────────────────────────
  # The ONLY job required by branch protection. Add every job to `needs:`.
  ok:
    name: ok
    if: always()
    needs: [changes, check, test, pre-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Pass
        run: echo 'All checks passed or were skipped'
