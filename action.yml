name: netspec
description: Comment on a pull request with what actually changed in a board's connectivity.
author: Cameron Brooks

# Needs `kicad-cli` on PATH. The simplest way is to run the job in a KiCad container:
#
#   jobs:
#     connectivity:
#       runs-on: ubuntu-latest
#       container: ghcr.io/inti-cmnb/kicad10_auto:latest
#       permissions: { contents: read, pull-requests: write }
#       steps:
#         - uses: actions/checkout@v4
#           with: { fetch-depth: 0 }
#         - uses: heibench/netspec@v0
#           with:
#             schematic: hardware/board.kicad_sch
#
# `fetch-depth: 0` matters: the base revision has to be in the clone for there to be
# anything to compare against.

branding:
  icon: git-pull-request
  color: green

inputs:
  schematic:
    description: Path to the .kicad_sch to compare. Repeat as newline-separated entries for several.
    required: true
  contract:
    description: Optional contract module to adjudicate against the head revision.
    required: false
    default: ""
  base-ref:
    description: Revision to compare against. Defaults to the pull request's base.
    required: false
    default: ""
  comment:
    description: Post the result as a pull request comment.
    required: false
    default: "true"
  fail-on-change:
    description: >-
      Fail the job on any connectivity change. Off by default -- changing the design is
      usually the point of the pull request. A violated contract or a suspected pin swap
      fails regardless.
    required: false
    default: "false"
  netspec-version:
    description: Version specifier to install.
    required: false
    default: "kicad-netspec"

outputs:
  changed:
    description: "true when connectivity differs from the base revision"
    value: ${{ steps.run.outputs.changed }}
  suspicious:
    description: "true when a change carries the signature of a defect"
    value: ${{ steps.run.outputs.suspicious }}
  report:
    description: The rendered Markdown report
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install netspec
      shell: bash
      env:
        NETSPEC_SPEC: ${{ inputs.netspec-version }}
      run: |
        set -e
        # KiCad CI images are minimal: ghcr.io/inti-cmnb/kicad10_auto ships Python 3.13
        # with no pip, no pip3, no pipx, no uv -- and no curl or wget to fetch one.
        # It is Debian, so bootstrap pip from the distro.
        if ! python3 -m pip --version >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq python3-pip
          else
            echo "::error::no pip, and no apt-get to install one" && exit 1
          fi
        fi
        # A distro Python is marked externally managed (PEP 668). Adding one
        # dependency-free package to a throwaway CI container is safe, so fall back to
        # overriding it rather than failing.
        # shellcheck disable=SC2086
        python3 -m pip install --quiet --disable-pip-version-check \
            --root-user-action=ignore $NETSPEC_SPEC \
          || python3 -m pip install --quiet --disable-pip-version-check \
            --root-user-action=ignore --break-system-packages $NETSPEC_SPEC

    - name: Trust the checkout
      shell: bash
      # Reading the base revision uses a git worktree, and a checkout made by a
      # different uid inside a container trips git's ownership check.
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

    - name: Compare connectivity
      id: run
      shell: bash
      env:
        NETSPEC_SCHEMATICS: ${{ inputs.schematic }}
        NETSPEC_CONTRACT: ${{ inputs.contract }}
        NETSPEC_BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha }}
        NETSPEC_FAIL_ON_CHANGE: ${{ inputs.fail-on-change }}
      run: python3 -m kicad_netspec.ci

    - name: Comment on the pull request
      # `always()` is load-bearing. The compare step exits non-zero precisely when it
      # finds something, and without this the comment explaining what it found would be
      # skipped exactly when it is most wanted.
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v9
      with:
        script: |
          const body = process.env.NETSPEC_REPORT;
          if (!body || !body.trim()) return;
          const marker = '<!-- netspec-connectivity -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const existing = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number,
          });
          // Update in place rather than stacking a comment per push.
          const mine = existing.find((c) => c.body && c.body.includes(marker));
          if (mine) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
      env:
        NETSPEC_REPORT: ${{ steps.run.outputs.report }}
